name: Daily Stock AI Research

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest -q
      - name: Generate and optionally email report
        env:
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS || 'AAPL,MSFT,NVDA' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '120' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m stock_research.main
      - uses: actions/upload-artifact@v4
        with:
          name: daily-stock-report
          path: reports/
